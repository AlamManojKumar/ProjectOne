name: Call Docker Workflow

on:
  push:
    branches:
      - master
      - develop

jobs:
  docker:
    uses: ./.github/workflows/docker_workflow.yml

    with:
      dockerimage: spring
      DOCKERHUB_USERNAME: alammanoj

    secrets:
      username: ${{ secrets.DOCKER_USERNAME }}
      password : ${{ secrets.DOCKERHUB_TOKEN }}