name: Docker Reusable Workflow
on:
  workflow_call:
    inputs:
      dockerimage:
        default: spring
        type: string
      DOCKERHUB_USERNAME:
        type: string
        default: alammanoj
        required: true
jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    steps:
      - name: checkout the repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install the docker 
        uses: docker/setup-buildx-action@v4
      - name: login to dockerhub
        uses: docker/login@action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Build and publish Image master
        if: ${{ github.ref_name == 'master' }}
        uses: docker/build-push-action@v4
        with: 
          push: true
          tags: ${{inputs.DOCKERHUB_USERNAME}}/${{inputs.dockerimage}}:${{ github.run_id }}
      - name: Build and publish image master
        if: ${{ github.ref_name != 'master' }}
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{inputs.DOCKERHUB_USERNAME}}/${{inputs.dockerimage}}-snapshot:${{ github.run_id }}

